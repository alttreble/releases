name: utorrent

services:
  utorrent:
    image: ekho/utorrent:latest
    volumes:
      - /mnt/drive1/config/utorrent:/utorrent/settings
      - /mnt/drive1/data/utorrent:/data
    environment:
      UID: 1000
      GID: 1000
      dir_autoload_delete: true
    ports:
      - 8093:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always
