# =============================================================================
# reSpeaker XVF3800 + XIAO ESP32-S3 — voice satellite, wake word "Patrick"
#
# This file is the device definition, NOT part of the Portainer stack. Copy it
# to /opt/stacks/esphome/config/ on VM 100 (alongside secrets.yaml) and build
# it from the ESPHome UI at http://192.168.1.100:6052.
#
# Nearly everything comes from formatBCE's packages. They carry the patched
# i2s_audio component and the XVF3800 driver — the stock ESPHome i2s_audio does
# not work with this board, because the mic array needs a 12.288 MHz MCLK that
# ESPHome cannot generate. The package firmware makes the XVF3800 the I2S master
# instead, and flashes itself over I2C from the ESP32 on first boot. There is no
# separate DFU step from a laptop.
# =============================================================================

substitutions:
  name: respeaker-patrick
  friendly_name: Patrick

  # Pin this to a tag or commit once the device is known-good. `main` tracks
  # upstream, and the YAML packages and the C++ components must agree, so this
  # one value selects both.
  respeaker_ref: main


packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

# A remote package cannot read secrets, so the credentials go here. ESPHome
# merges these blocks with the ones the packages define.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# "Patrick" is not a model that exists yet — it has to be trained (see
# README.md). Until then this stays commented out and the satellite answers to
# the wake words the package already ships: okay_nabu, kenobi, hey_jarvis,
# hey_mycroft. "hey jarvis" is the one to use meanwhile.
#
# Do NOT bridge the gap by pointing this at a stock model. The package already
# defines hey_jarvis with its own id, and a second entry loading the same model
# under id "patrick" runs the detector twice — wasted PSRAM, and both fire on
# one utterance, which the package reports as duplicate_wake_up_detected.
#
# When models/patrick.json exists, uncomment this and push it over OTA. ESPHome
# merges package lists by appending, so it adds Patrick rather than replacing
# the stock words, and the package's "Wake word sensitivity" select goes on
# tuning only its own three.
#
# micro_wake_word:
#   models:
#     - model: /config/models/patrick.json
#       id: patrick
