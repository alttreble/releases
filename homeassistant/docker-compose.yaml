
services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/stacks/homeassistant/config:/config
      # Camera clips written by camera.record. /media is HA's default media dir,
      # so it needs no allowlist_external_dirs entry and shows up in the media
      # browser. Bulk data, so it belongs on tank (virtiofs) and not on the
      # VM's zvol — and without this mount the clips would live in the
      # container layer and vanish on every Portainer redeploy.
      - /srv/media/camera:/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - default
      - proxy
    ports:
      - 8123:8123
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.homeassistant.rule=Host(`ha.tedraykov.me`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      - "traefik.http.routers.homeassistant.tls=true"

  # Not deployed - it was defined on sof1 but never running, and has no
  # data directory. Start explicitly with: --profile optional
  nodered:
    profiles: ["optional"]
    container_name: nodered
    image: nodered/node-red
    volumes:
      - /opt/stacks/homeassistant/nodered:/data
    depends_on:
      - homeassistant
      - mosquitto
    environment:
      - TZ=Europe/Sofia
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.nodered.rule=Host(`nodered.tedraykov.me`)"
      - "traefik.http.routers.nodered.entrypoints=websecure"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"
      - "traefik.http.routers.nodered.tls=true"

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - "/opt/stacks/homeassistant/mosquitto/config:/mosquitto/config"
      - "/opt/stacks/homeassistant/mosquitto/data:/mosquitto/data"
      - "/opt/stacks/homeassistant/mosquitto/log:/mosquitto/log"
    environment:
      - TZ=Europe/Sofia
    user: "${PUID}:${PGID}"

  hass-configurator:
    image: "causticlab/hass-configurator-docker:latest"
    container_name: hass-configurator
    ports:
      - 3218:3218
    restart: always
    volumes:
      - "/opt/stacks/homeassistant/hass-configurator:/config"
      - "/opt/stacks/homeassistant/config:/hass"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.hass-configurator.rule=Host(`hass-configurator.tedraykov.me`)"
      - "traefik.http.routers.hass-configurator.entrypoints=websecure"
      - "traefik.http.services.hass-configurator.loadbalancer.server.port=3218"
      - "traefik.http.routers.hass-configurator.tls=true"

  zigbee2mqtt:
    container_name: zigbee2mqtt
    ports:
      - 8080:8080
    restart: unless-stopped
    image: koenkk/zigbee2mqtt
    depends_on:
      - mosquitto
    volumes:
      - /opt/stacks/homeassistant/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_568ca15e4e1fef11a7fd56d0639e525b-if00-port0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Sofia
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee2mqtt.tedraykov.me`)"
      - "traefik.http.routers.zigbee2mqtt.entrypoints=websecure"
      - "traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080"
      - "traefik.http.routers.zigbee2mqtt.tls=true"

networks:
  proxy:
    name: "proxy"
    external: true
