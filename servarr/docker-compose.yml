name: servarr

# Automated media pipeline:
#   Overseerr (request) -> Sonarr/Radarr (search via Prowlarr) -> qBittorrent (download)
#   -> hardlink+rename into /data/media -> Jellyfin picks it up.
#
# All services share a single /srv/media:/data mount so qBittorrent and the
# *arr apps can hardlink (instant moves, no double disk usage). Required layout:
#   /srv/media/torrents/{movies,tv}   <- qBittorrent saves here
#   /srv/media/media/{movies,tv}      <- *arr imports here, Jellyfin reads here

x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: 1000
    PGID: 1000
    TZ: Europe/Sofia
  networks:
    default:
    proxy:

services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - /opt/stacks/servarr/prowlarr:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.tedraykov.me`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: servarr-flaresolverr
    environment:
      <<: *common-env
      LOG_LEVEL: info

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - /opt/stacks/servarr/sonarr:/config
      - /srv/media:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.tedraykov.me`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - /opt/stacks/servarr/radarr:/config
      - /srv/media:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.tedraykov.me`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8084
    volumes:
      - /opt/stacks/servarr/qbittorrent:/config
      - /srv/media:/data
    ports:
      - 6881:6881        # torrent TCP
      - 6881:6881/udp    # torrent UDP
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.tedraykov.me`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8084

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    volumes:
      - /opt/stacks/servarr/bazarr:/config
      - /srv/media:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.tedraykov.me`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.services.bazarr.loadbalancer.server.port=6767

  overseerr:
    <<: *common
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    volumes:
      - /opt/stacks/servarr/overseerr:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.overseerr.rule=Host(`overseerr.tedraykov.me`)
      - traefik.http.routers.overseerr.entrypoints=websecure
      - traefik.http.routers.overseerr.tls=true
      - traefik.http.services.overseerr.loadbalancer.server.port=5055

networks:
  proxy:
    name: proxy
    external: true
