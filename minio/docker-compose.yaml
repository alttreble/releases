name: minio

# S3-compatible object storage for the home lab. Moved from VM 200 (DMZ) to
# VM 100 on 2026-08-29: it holds the Obsidian vaults, which are personal notes
# and a *sync* target - corruption propagates to every device. It has no
# business sitting in a VM that untrusted tenants can deploy code into.
#
# Pinned, not :latest. The excalidash migration showed how :latest silently
# upgrades a data-bearing service the moment it lands on a new host.
#
# Ports are published deliberately: Traefik on VM 100 routes via its file
# provider (/opt/stacks/traefik/dynamic/homelab.yml -> http://192.168.1.100:9000
# and :9001), not via container labels. The labels below are kept for parity
# with the other VM 100 stacks and are inert until a docker provider is added.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - 9000:9000   # S3 API
      - 9001:9001   # web console
    environment:
      # Credentials come from bind-mounted files, NOT from Portainer stack
      # variables - those get written into Portainer's own database. Same
      # reasoning as the traefik stack's CF_DNS_API_TOKEN_FILE.
      - MINIO_ROOT_USER_FILE=/run/secrets/minio_root_user
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
      - MINIO_BROWSER_REDIRECT_URL=https://minio-console.tedraykov.me
      - TZ=Europe/Sofia
    volumes:
      - /opt/stacks/minio/data:/data
      - /opt/stacks/minio/secrets/root_user:/run/secrets/minio_root_user:ro
      - /opt/stacks/minio/secrets/root_password:/run/secrets/minio_root_password:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.minio.rule=Host(`minio.tedraykov.me`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.service=minio-api"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.tedraykov.me`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    networks:
      default:
      proxy:

networks:
  proxy:
    name: "proxy"
    external: true
