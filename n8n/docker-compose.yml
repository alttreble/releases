version: '3.8'

volumes:
  db_storage:
  n8n_storage:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.4
    restart: always
    environment:
      - N8N_HOST=n8n.tedraykov.me
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=https://n8n.tedraykov.me/
    volumes:
      - /mnt/drive1/data/n8n:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.n8n.rule=Host(`n8n.tedraykov.me`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.http.routers.n8n.tls.certresolver=tlsresolver"
    networks:
      default:
      proxy:

networks:
  proxy:
    name: "proxy"
    external: true
