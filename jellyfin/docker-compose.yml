name: jellyfin

services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    environment:
      - TZ=Europe/Sofia
      - JELLYFIN_PublishedServerUrl=https://jellyfin.tedraykov.me
      # NVENC/NVDEC on the passed-through RTX 3060. No /dev/dri needed.
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    hostname: JellyfinServer
    volumes:
      - /opt/stacks/jellyfin/config:/config
      - /opt/stacks/jellyfin/cache:/cache
      - /opt/stacks/jellyfin/transcode:/transcode
      - /srv/media:/data:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.tedraykov.me`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.service=jellyfin"
      - "traefik.http.routers.jellyfin.tls=true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      default:
      proxy:

networks:
  proxy:
    name: "proxy"
    external: true
