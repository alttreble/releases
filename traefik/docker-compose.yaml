# Traefik on VM 100 (trusted zone).
#
# Certificates: a single *.tedraykov.me wildcard issued via Cloudflare DNS-01.
# It is set as the default cert in dynamic/tls.yml, so routers only need
# `tls=true` - no per-router certresolver, no per-name issuance, and new
# subdomains work the moment a label exists.
#
# The Cloudflare token can rewrite ANY record in the zone (including MX).
# It lives on VM 100 only and must never be copied to VM 200 (DMZ).

services:
  # Read-only Docker API. Traefik never touches the socket directly - a
  # compromised Traefik would otherwise be root on the VM holding the photo
  # library and Home Assistant.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: traefik-dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - dockerproxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # File-based, not an env var: a Portainer stack variable would store the
      # token in Portainer's database, and env_file with a host path does not
      # work in Portainer-deployed stacks (compose runs inside its container).
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_token
    volumes:
      - /opt/stacks/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/stacks/traefik/dynamic:/etc/traefik/dynamic:ro
      - /opt/stacks/traefik/letsencrypt:/letsencrypt
      - /opt/stacks/traefik/cf_token:/run/secrets/cf_token:ro
    networks:
      default:
      proxy:

networks:
  proxy:
    name: "proxy"
    external: true
