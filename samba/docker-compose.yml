name: samba

# SMB/CIFS, so macOS Finder can mount tank/media directly.
#
# WHY SMB AND NOT NFS: macOS dropped AFP, and Finder's NFS client has no auth,
# no Keychain integration and no uid mapping worth the name. SMB3 is the native
# path on macOS - it authenticates, survives sleep/wake, and this image's base
# smb.conf already carries the vfs_fruit block that stops Finder littering ._
# AppleDouble files through the library where the *arr importers would trip
# over them.
#
# WHY VM 100 AND NOT THE PROXMOX HOST: Samba is a network file service with a
# long CVE history. On the console-less hypervisor a compromise is a
# *hypervisor* compromise; here it is bounded by the VM.
#
# NOT PUBLIC, EVER. 445 is among the most-scanned ports on the internet. There
# is deliberately no Traefik label here, no route in homelab.yml, and no DMZ
# hole in 100.fw. Remote access is Tailscale on VM 100 - you join the tailnet
# and then mount the same share at the same path.
#
# WHERE THE PASSWORDS LIVE, and why they are not in this file. This image can
# only create an account from an ACCOUNT_<user> env var: there is no _FILE
# variant, and the entrypoint regenerates the passdb from env on every start,
# so persisting /var/lib/samba does not avoid it. This repo is PUBLIC, and
# env_file with a host path does not work under Portainer (it runs compose
# inside its own container and cannot read VM 100's filesystem). So the values
# are interpolated from SMB_PASSWORD_* instead, supplied as **Portainer stack
# environment variables**, which means they live in Portainer's own database.
# That is a deliberate step down from the bind-mounted-secret pattern traefik
# and immich use, and it is only acceptable because these are LAN/tailnet-only
# share passwords rather than anything that can reach outside the house. The
# Cloudflare token must still NEVER be handed to Portainer this way.
#
# The ":?" makes compose fail loudly rather than silently creating an account
# with an empty password. Interpolation also reads a .env sitting next to this
# file, so a hand-deploy from /opt/stacks/samba still works unchanged:
#   cd /opt/stacks/samba && docker compose up -d
#
# host networking is required, not a shortcut: avahi and wsdd2 announce the
# server over mDNS so it appears in Finder's sidebar under Network, and
# neither survives a bridge network's NAT.
#
# EXTENDED ATTRIBUTES DO NOT WORK ON THIS SHARE. Proxmox starts virtiofsd
# without --xattr unless the virtiofs device carries expose-xattr=1, so user.*
# xattrs on /srv/media fail with ENOTSUP (verified: they work on VM 100's own
# disk, they do not on the virtiofs mount). The image's base smb.conf assumes
# they work, so SAMBA_GLOBAL_STANZA overrides it to the AppleDouble fallback.
# Fixing it properly is `qm set 100 -virtiofs1 dirid=media,expose-xattr=1`
# plus a VM 100 STOP/START - virtiofsd is forked by the VM start task, so a
# guest reboot will not respawn it with new flags.

services:
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    restart: unless-stopped
    network_mode: host
    # The versioned tags upstream stop at s4.18.2-r0 (May 2023); :latest is the
    # maintained stream and was rebuilt 2026-07-11. Pin a digest here if you
    # want this reproducible.
    environment:
      - TZ=Europe/Sofia

      # -- accounts -------------------------------------------------------
      # Each person gets their own login and password so either can be changed
      # or revoked without touching the other. UID_<user> is only read if the
      # matching ACCOUNT_<user> exists - that pairing is why the accounts
      # cannot move out of env entirely.
      - "ACCOUNT_teo=${SMB_PASSWORD_TEO:?set SMB_PASSWORD_TEO in the stack env}"
      - UID_teo=1000
      - "ACCOUNT_iva=${SMB_PASSWORD_IVA:?set SMB_PASSWORD_IVA in the stack env}"
      - UID_iva=1001

      # How the server presents itself in Finder's sidebar.
      - AVAHI_NAME=homelab
      - MODEL=Macmini
      - SAMBA_CONF_SERVER_STRING=homelab

      # SAMBA_GLOBAL_STANZA is undocumented but it is the only usable channel
      # for multi-word values: the SAMBA_GLOBAL_CONFIG_* loop in the image's
      # entrypoint iterates over an UNQUOTED $(env | grep ...), so a value
      # containing a space is word-split and writes garbage lines into
      # smb.conf. This one is quoted, and ';' becomes a newline.
      # Later keys win over the base smb.conf, so these three override it:
      #   vfs objects      - streams_xattr dropped, it needs user xattrs
      #   fruit:metadata   - netatalk, i.e. ._ AppleDouble sidecars not xattrs
      #   ea support       - off, nothing can honour it on this mount
      - SAMBA_GLOBAL_STANZA=vfs objects = catia fruit; fruit:metadata = netatalk; ea support = no; server min protocol = SMB3

      # Only tank/media is shared. immich is deliberately absent - that library
      # is Immich-managed and a stray Finder move would desynchronise its
      # database from the files on disk. /mnt/archive is host-only and is not
      # virtiofs'd into this VM at all.
      #
      # force user/group pins every write to teo (1000:1000) whoever logged in.
      # The whole media tree is 1000-owned and Sonarr/Radarr/qBittorrent run at
      # PUID 1000; without this, iva's files would land 1001:1001 and the *arr
      # importers could no longer rewrite them. Authentication stays per-person,
      # only the resulting file ownership is shared.
      - SAMBA_VOLUME_CONFIG_media=[media]; path=/shares/media; valid users = teo, iva; force user = teo; force group = teo; guest ok = no; read only = no; browseable = yes
    volumes:
      # tank/media via virtiofs. Hardlinks work through virtiofs and the *arr
      # import pipeline depends on it - never remap this to a copy, and never
      # split /data/torrents from /data/media across devices.
      - /srv/media:/shares/media
      # VM 100 already runs its own avahi-daemon on 0.0.0.0:5353, which would
      # collide with the container's under host networking. Mounting this
      # disables the internal avahi; the container instead writes and maintains
      # samba.service here for the host daemon to advertise. The directory is
      # otherwise empty, and the file IS overwritten - do not put anything else
      # in it.
      - /etc/avahi/services:/external/avahi
