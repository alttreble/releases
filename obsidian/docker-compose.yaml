services:
  minio:
    image: minio/minio:latest
    container_name: obsidian-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - /mnt/drive1/data/obsidian-sync:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.obsidian-sync.rule=Host(`obsidian-sync.treble.bg`)"
      - "traefik.http.routers.obsidian-sync.entrypoints=websecure"
      - "traefik.http.services.obsidian-sync.loadbalancer.server.port=9000"
      - "traefik.http.routers.obsidian-sync.tls.certresolver=tlsresolver"

networks:
  proxy:
    external: true
