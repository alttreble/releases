name: erpnext-image

# Builds frappe/erpnext + extra apps (see erpnext/apps.json) into one image.
# Dokploy's erpnext-v16 service pulls it by setting IMAGE_NAME/VERSION.
# Apps live in the image, not the sites volume, so adding an app means a
# rebuild here, then `bench --site <site> install-app <app>` and a migrate.

on:
  push:
    branches: [trunk]
    paths:
      - erpnext/apps.json
      - .github/workflows/erpnext-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alttreble/erpnext-wiki
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=erpnext/apps.json
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.FRAPPE_BRANCH }}
            ${{ env.IMAGE }}:${{ env.FRAPPE_BRANCH }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
