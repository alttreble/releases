name: immich

# Photo library. Migrated from sof1 2026-08-23. Converted from Portainer stack
# 1 (an uploaded editor stack) to git-backed stack 13 on 2026-08-31 - this file
# is now the source of truth, and a redeploy is
#   PUT /api/stacks/13/git/redeploy?endpointId=1  {"pullImage":true}
#
# Upgraded 1.120.2 -> 3.1.0 the same day, and it had to be done in three hops:
# 1.132.3 (v1.137.0's TypeORM gate), then 2.7.5 (the pgvecto.rs -> VectorChord
# migration, which v3 deleted), then 3.1.0. See the git log for why each stop
# exists before collapsing them.
#
# TWO STORAGE TIERS, and the split is not negotiable:
#   /srv/immich  -> /data       -> tank/immich (ZFS mirror) via virtiofs. Bulk
#                                  media only. 124 G, irreplaceable.
#   /opt/stacks/immich/pgdata   -> VM 100's own zvol (ext4 on NVMe). NEVER put
#                                  Postgres on virtiofs - locking corruption.
#
# The DB password is bind-mounted from /opt/stacks/immich/secrets/db_password
# (mode 600, owned 999:999 so the postgres user inside the container can read
# it) and consumed via the _FILE variants. This repo is PUBLIC - nothing that
# lands here may contain a secret, and a Portainer stack variable would only
# have moved the password into Portainer's own database.
#
# Ports are published deliberately: Traefik on VM 100 routes via its file
# provider (/opt/stacks/traefik/dynamic/homelab.yml -> http://192.168.1.100:2283),
# not via container labels. The labels below are kept for parity with the other
# VM 100 stacks and are inert until a docker provider is added.

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    restart: always
    ports:
      - 2283:2283
    volumes:
      # /data, not the old /usr/src/app/upload. Upstream changed the default in
      # v1.137.0 and Immich still prefers the legacy path when it exists, so this
      # is a choice, not a requirement - made now so we stop depending on a
      # backwards-compatibility branch that will not live forever.
      #
      # Immich detects the move and rewrites the stored paths itself. There are
      # 27456 of them across asset.originalPath, asset_file.path,
      # person.thumbnailPath and user.profileImagePath, all currently absolute
      # and prefixed /usr/src/app/upload. Nothing on the host side moves:
      # /srv/immich already contains library/, upload/, thumbs/, encoded-video/,
      # profile/ and backups/, which is the layout /data expects.
      - /srv/immich:/data
      - /etc/localtime:/etc/localtime:ro
      - /opt/stacks/immich/secrets/db_password:/run/secrets/db_password:ro
    environment:
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOSTNAME=immich_redis
      - TZ=Europe/Sofia
    depends_on:
      - redis
      - database
    # NVENC, inlined from upstream's hwaccel.transcoding.yml `nvenc` service so
    # this stays a single file Portainer can deploy. The RTX 3060 is already
    # doing Jellyfin's transcoding; no /dev/dri is involved on either.
    # Still needs Hardware Acceleration = NVENC set in Immich's admin settings -
    # this only grants the container the device.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.immich.rule=Host(`photos.tedraykov.me`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.tls=true"
    networks:
      default:
      proxy:

  immich-machine-learning:
    container_name: immich_machine_learning
    # -cuda, not the plain tag. The plain image is CPU-only ONNX, which is what
    # this stack had been running since the sof1 migration - the GPU device
    # reservation that used to sit here did nothing, because the image had no
    # CUDA runtime to use it. Smart search and face recognition are the two
    # jobs that care.
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda
    restart: always
    volumes:
      - model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    container_name: immich_redis
    # Valkey, per upstream. Immich only uses this as a BullMQ queue and it has
    # no volume, so the swap costs nothing but in-flight jobs, which requeue.
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich_postgres
    # Immich's own Postgres, and the whole reason this deploy is separate. It
    # ships vchord (VectorChord), vector (pgvector) AND vectors (pgvecto.rs) at
    # once, with shared_preload_libraries = 'vchord.so, vectors.so' baked into
    # /etc/postgresql/postgresql.conf. Both extensions loaded simultaneously is
    # exactly the precondition the migration guide asks for, and because this
    # container is superuser the reindex needs no manual SQL.
    #
    # Still PostgreSQL 14 (14.19 vs the 14.17 we were on), so the data directory
    # is used in place - no dump/restore, no pg_upgrade.
    #
    # Digest-pinned: the tag itself moves.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /opt/stacks/immich/pgdata:/var/lib/postgresql/data
      - /opt/stacks/immich/secrets/db_password:/run/secrets/db_password:ro

networks:
  proxy:
    name: "proxy"
    external: true

volumes:
  model-cache:
