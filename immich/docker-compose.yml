name: immich

# Photo library. Migrated from sof1 2026-08-23, converted to a git-backed
# Portainer stack 2026-08-31 (stack 1) - this file is now the source of truth.
#
# TWO STORAGE TIERS, and the split is not negotiable:
#   /srv/immich                 -> tank/immich (ZFS mirror) via virtiofs. Bulk
#                                  media only. 124 G, irreplaceable.
#   /opt/stacks/immich/pgdata   -> VM 100's own zvol (ext4 on NVMe). NEVER put
#                                  Postgres on virtiofs - locking corruption.
#
# The DB password is bind-mounted from /opt/stacks/immich/secrets/db_password
# (mode 600, owned 999:999 so the postgres user inside the container can read
# it) and consumed via the _FILE variants. This repo is PUBLIC - nothing that
# lands here may contain a secret, and a Portainer stack variable would only
# have moved the password into Portainer's own database.
#
# Ports are published deliberately: Traefik on VM 100 routes via its file
# provider (/opt/stacks/traefik/dynamic/homelab.yml -> http://192.168.1.100:2283),
# not via container labels. The labels below are kept for parity with the other
# VM 100 stacks and are inert until a docker provider is added.

services:
  immich-server:
    container_name: immich_server
    # SECOND WAY-POINT. The TypeORM gate (1.132.3) is behind us; this stop
    # exists to run the pgvecto.rs -> VectorChord migration, which v3 deleted.
    image: ghcr.io/immich-app/immich-server:v2.7.5
    restart: always
    ports:
      - 2283:2283
    volumes:
      - /srv/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - /opt/stacks/immich/secrets/db_password:/run/secrets/db_password:ro
    environment:
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOSTNAME=immich_redis
      - TZ=Europe/Sofia
    depends_on:
      - redis
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.immich.rule=Host(`photos.tedraykov.me`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.tls=true"
    networks:
      default:
      proxy:

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
    restart: always
    volumes:
      - model-cache:/cache

  redis:
    container_name: immich_redis
    # Valkey, per upstream. Immich only uses this as a BullMQ queue and it has
    # no volume, so the swap costs nothing but in-flight jobs, which requeue.
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich_postgres
    # Immich's own Postgres, and the whole reason this deploy is separate. It
    # ships vchord (VectorChord), vector (pgvector) AND vectors (pgvecto.rs) at
    # once, with shared_preload_libraries = 'vchord.so, vectors.so' baked into
    # /etc/postgresql/postgresql.conf. Both extensions loaded simultaneously is
    # exactly the precondition the migration guide asks for, and because this
    # container is superuser the reindex needs no manual SQL.
    #
    # Still PostgreSQL 14 (14.19 vs the 14.17 we were on), so the data directory
    # is used in place - no dump/restore, no pg_upgrade.
    #
    # Digest-pinned: the tag itself moves.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /opt/stacks/immich/pgdata:/var/lib/postgresql/data
      - /opt/stacks/immich/secrets/db_password:/run/secrets/db_password:ro

networks:
  proxy:
    name: "proxy"
    external: true

volumes:
  model-cache:
